global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']

  - job_name: order-svc
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['order-svc:8081']

  - job_name: dispatch-svc
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['dispatch-svc:8082']

  - job_name: tracking-svc
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['tracking-svc:8083']

  - job_name: payment-svc
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['payment-svc:8084']

  - job_name: notification-svc
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['notification-svc:8085']
