<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:687px;height:453px;background:#FFFFFF;" width="687px" height="453px" viewBox="0 0 687 453" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="12"><text x="251.586" y="22.995" fill="#000" font-size="14" textLength="177.42" font-weight="700">Offer — State Machine</text></g><g class="entity" data-qualified-name="PENDING" id="ent0001" data-source-line="24"><rect x="100.97" y="150.297" width="299.442" height="58.414" fill="#FAFAFA" style="stroke:#555;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="100.97" y1="173.102" x2="400.412" y2="173.102" style="stroke:#555;stroke-width:0.5;"/><text x="225.552" y="165.507" fill="#000" font-size="11" textLength="50.279">PENDING</text><text x="105.97" y="188.312" fill="#000" font-size="11" textLength="279.442">at most one PENDING offer per delivery (invariant)</text><text x="105.97" y="201.117" fill="#000" font-size="11" textLength="236.436">deadline stored in dispatch DB (ADR 0004)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0002" data-source-line="14"><ellipse cx="250.69" cy="53.297" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="ACCEPTED" id="ent0004" data-source-line="16"><rect x="371.38" y="294.727" width="78.609" height="50" fill="#FAFAFA" style="stroke:#555;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="371.38" y1="317.532" x2="449.989" y2="317.532" style="stroke:#555;stroke-width:0.5;"/><text x="381.38" y="309.937" fill="#000" font-size="11" textLength="58.609">ACCEPTED</text></g><g class="entity" data-qualified-name="REFUSED" id="ent0006" data-source-line="17"><rect x="7" y="294.727" width="71.375" height="50" fill="#FAFAFA" style="stroke:#555;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="317.532" x2="78.375" y2="317.532" style="stroke:#555;stroke-width:0.5;"/><text x="17" y="309.937" fill="#000" font-size="11" textLength="51.375">REFUSED</text></g><g class="entity" data-qualified-name="EXPIRED" id="ent0008" data-source-line="18"><rect x="484.97" y="294.727" width="67.427" height="50" fill="#FAFAFA" style="stroke:#555;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="484.97" y1="317.532" x2="552.397" y2="317.532" style="stroke:#555;stroke-width:0.5;"/><text x="494.97" y="309.937" fill="#000" font-size="11" textLength="47.427">EXPIRED</text></g><g class="end_entity" data-qualified-name=".end." id="ent0010" data-source-line="20"><ellipse cx="410.69" cy="428.737" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="410.69" cy="428.737" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="entity" data-qualified-name="GMN14" id="ent0015" data-source-line="28"><path d="M113.03,282.717 L113.03,315.727 L78.59,319.727 L113.03,323.727 L113.03,356.74 A0,0 0 0 0 113.03,356.74 L336.343,356.74 A0,0 0 0 0 336.343,356.74 L336.343,292.717 L326.343,282.717 L113.03,282.717 A0,0 0 0 0 113.03,282.717" style="stroke:#D0D0D0;stroke-width:0.5;" fill="#FFFDE7"/><path d="M326.343,282.717 L326.343,292.717 L336.343,292.717 L326.343,282.717" style="stroke:#D0D0D0;stroke-width:0.5;" fill="#FFFDE7"/><text x="119.03" y="297.927" fill="#000" font-size="11" textLength="139.879">On REFUSED or EXPIRED:</text><text x="119.03" y="310.732" fill="#000" font-size="11" textLength="201.905">dispatch removes the candidate and</text><text x="119.03" y="323.537" fill="#000" font-size="11" textLength="202.313">creates a new offer for the next one.</text><text x="119.03" y="336.341" fill="#000" font-size="11" textLength="134.122">If no candidates remain:</text><text x="119.03" y="349.146" fill="#000" font-size="11" textLength="144.971">alert to operator (SYS-04).</text></g><!--link *start* to PENDING--><g class="link" data-entity-1="ent0002" data-entity-2="ent0001" id="lnk3" data-source-line="14" data-link-type="dependency"><path d="M250.69,63.637 C250.69,81.747 250.69,117.297 250.69,145.037" style="stroke:#333;stroke-width:1;" fill="none" id="*start*-to-PENDING"/><polygon points="250.69,150.037,254.69,141.037,250.69,145.037,246.69,141.037,250.69,150.037" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="251.69" y="104.507" fill="#000" font-size="11" textLength="120.474">dispatch creates offer</text><text x="263.332" y="117.312" fill="#000" font-size="11" textLength="97.19">for one candidate</text></g><!--link PENDING to ACCEPTED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk5" data-source-line="16" data-link-type="dependency"><path d="M241.49,209.107 C238.7,223.537 238.45,240.507 247.69,252.717 C277.22,291.767 308.97,262.767 353.69,282.717 C360.96,285.957 364.11,287.433 371.1,291.653" style="stroke:#333;stroke-width:1;" fill="none" id="PENDING-to-ACCEPTED"/><polygon points="375.38,294.237,369.743,286.161,371.1,291.653,365.608,293.01,375.38,294.237" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="248.69" y="249.927" fill="#000" font-size="11" textLength="226.864">courier accepts within deadline (COU-02)</text></g><!--link PENDING to REFUSED--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk7" data-source-line="17" data-link-type="dependency"><path d="M147.02,209.047 C128.82,216.867 110.87,226.627 95.69,238.717 C77.05,253.557 64.983,272.339 55.943,289.949" style="stroke:#333;stroke-width:1;" fill="none" id="PENDING-to-REFUSED"/><polygon points="53.66,294.397,61.329,288.217,55.943,289.949,54.212,284.563,53.66,294.397" fill="#333" style="stroke:#333;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="96.69" y="249.927" fill="#000" font-size="11" textLength="136.915">courier refuses (COU-02)</text></g><!--link