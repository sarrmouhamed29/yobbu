lects couriers, tracks deliveries</text><text x="481.77" y="304.291" fill="#000" font-size="10" textLength="116.67">live, notifies all parties.</text></g><!--entity Customer--><g class="entity" data-qualified-name="Customer" id="ent0001" data-source-line="26"><ellipse cx="472.337" cy="51.297" rx="8" ry="8" fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M472.337,59.297 L472.337,86.297 M459.337,67.297 L485.337,67.297 M472.337,86.297 L459.337,101.297 M472.337,86.297 L485.337,101.297" style="stroke:#F9A825;stroke-width:0.5;" fill="none"/><text x="445.24" y="112.079" fill="#000" font-size="10" textLength="54.194" font-weight="700">Customer</text><text x="445.24" y="123.72" fill="#000" font-size="10" textLength="48.125" font-weight="700">[Person]</text></g><!--entity Courier--><g class="entity" data-qualified-name="Courier" id="ent0002" data-source-line="27"><ellipse cx="700.333" cy="51.297" rx="8" ry="8" fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M700.333,59.297 L700.333,86.297 M687.333,67.297 L713.333,67.297 M700.333,86.297 L687.333,101.297 M700.333,86.297 L713.333,101.297" style="stroke:#F9A825;stroke-width:0.5;" fill="none"/><text x="676.27" y="112.079" fill="#000" font-size="10" textLength="41.401" font-weight="700">Courier</text><text x="676.27" y="123.72" fill="#000" font-size="10" textLength="48.125" font-weight="700">[Person]</text></g><!--entity Operator--><g class="entity" data-qualified-name="Operator" id="ent0003" data-source-line="28"><ellipse cx="939.332" cy="51.297" rx="8" ry="8" fill="#FFF9C4" style="stroke:#F9A825;stroke-width:0.5;"/><path d="M939.332,59.297 L939.332,86.297 M926.332,67.297 L952.332,67.297 M939.332,86.297 L926.332,101.297 M939.332,86.297 L952.332,101.297" style="stroke:#F9A825;stroke-width:0.5;" fill="none"/><text x="913.98" y="112.079" fill="#000" font-size="10" textLength="50.703" font-weight="700">Operator</text><text x="913.98" y="123.72" fill="#000" font-size="10" textLength="48.125" font-weight="700">[Person]</text></g><!--entity Keycloak--><g class="entity" data-qualified-name="Keycloak" id="ent0006" data-source-line="39"><rect x="482.37" y="414.647" width="199.937" height="66.563" fill="#F5F5F5" style="stroke:#9E9E9E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="492.37" y="433.929" fill="#000" font-size="10" textLength="44.941">Keycloak</text><text x="492.37" y="445.57" fill="#000" font-size="10" textLength="90.874">[Identity Provider]</text><text x="492.37" y="457.21" fill="#000" font-size="10" textLength="179.937">OIDC + PKCE — manages accounts,</text><text x="492.37" y="468.851" fill="#000" font-size="10" textLength="124.692">roles and token issuance</text></g><!--entity Notif--><g class="entity" data-qualified-name="Notif" id="ent0007" data-source-line="40"><rect x="717.15" y="420.467" width="204.365" height="54.922" fill="#F5F5F5" style="stroke:#9E9E9E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="727.15" y="439.749" fill="#000" font-size="10" textLength="106.821">Notification Channels</text><text x="727.15" y="451.39" fill="#000" font-size="10" textLength="184.365">[External System — simulated in V1]</text><text x="727.15" y="463.03" fill="#000" font-size="10" textLength="147.681">Push, SMS and email delivery</text></g><!--entity Tiles--><g class="entity" data-qualified-name="Tiles" id="ent0008" data-source-line="41"><rect x="7" y="414.647" width="214.668" height="66.563" fill="#F5F5F5" style="stroke:#9E9E9E;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="17" y="433.929" fill="#000" font-size="10" textLength="92.056">Map Tiles Provider</text><text x="17" y="445.57" fill="#000" font-size="10" textLength="89.937">[External System]</text><text x="17" y="457.21" fill="#000" font-size="10" textLength="194.668">OpenStreetMap-compatible raster tiles</text><text x="17" y="468.851" fill="#000" font-size="10" textLength="101.909">(self-hosted or CDN)</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="52"><path d="M256.95,431.287 L256.95,443.927 L221.71,447.927 L256.95,451.927 L256.95,464.568 A0,0 0 0 0 256.95,464.568 L447.716,464.568 A0,0 0 0 0 447.716,464.568 L447.716,441.287 L437.716,431.287 L256.95,431.287 A0,0 0 0 0 256.95,431.287" style="stroke:#D0D0D0;stroke-width:0.5;" fill="#FFFDE7"/><path d="M437.716,431.287 L437.716,441.287 L447.716,441.287 L437.716,431.287" style="stroke:#D0D0D0;stroke-width:0.5;" fill="#FFFDE7"/><text x="262.95" y="445.569" fill="#000" font-size="10" textLength="169.766">ADR for tile provider to be written</text><text x="262.95" y="457.21" fill="#000" font-size="10" textLength="152.28">in phase 0.4 (1.4 in PLAN.md).</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="57"><path d="M956.2,425.467 L956.2,470.389 L1254.475,470.389 L1254.475,435.467 L1244.475,425.467 L956.2,425.467" style="stroke:#D0D0D0;stroke-width:0.5;" fill="#FFFDE7"/><path d="M1244.475,425.467 L1244.475,435.467 L1254.475,435.467 L1244.475,425.467" style="stroke:#D0D0D0;stroke-width:1;" fill="#FFFDE7"/><text x="962.2" y="439.749" fill="#000" font-size="10" textLength="252.749">The simulated merchant and the courier simulator</text><text x="962.2" y="451.39" fill="#000" font-size="10" textLength="277.275">are internal actors of the system, not external persons.</text><text x="962.2" y="463.03" fill="#000" font-size="10" textLength="243.569">They appear in the containers view (C4 Level 2).</text></g><!--link Customer to Yobbu--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk9" data-source-line="43" data-link-type="dependency"><path d="M474.19,126.437 C477.37,146.137 484.75,168.207 501.33,181.087 C517.14,193.367 666.11,176.077 681.33,189.087 C685.289,192.468 688.561,196.43 691.256,200.777 C691.929,201.864 692.567,202.975 693.17,204.107 C693.321,204.39 691.187,229.507 691.334,229.793" style="stroke:#444;stroke-width:1.2;" fill="none" id="Customer-to-Yobbu"/><polygon points="693.616,234.241,693.067,224.408,691.334,229.793,685.949,228.059,693.616,234.241" fill="#444" style="stroke:#444;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="502.33" y="166.369" fill="#000" font-size="10" textLength="186.694">places order, tracks delivery on map,</text><text x="504.459" y="178.01" fill="#000" font-size="10" textLength="182.437">receives notifications, cancels, rates</text></g><!--link Courier to Yobbu--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk10" data-source-line="44" data-link-type="dependency"><path d="M698.29,126.517 C697.9,136.217 697.54,146.507 697.33,156.087 C697.038,169.899 697.071,184.561 697.287,198.818 C697.314,200.6 697.344,202.376 697.376,204.143 C697.38,204.364 697.291,228.867 697.295,229.087" style="stroke:#444;stroke-width:1.2;" fill="none" id="Courier-to-Yobbu"/><polygon points="697.389,234.086,701.219,225.013,697.295,229.087,693.22,225.163,697.389,234.086" fill="#444" style="stroke:#444;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="716.433" y="166.369" fill="#000" font-size="10" textLength="161.489">reports availability and position,</text><text x="698.33" y="178.01" fill="#000" font-size="10" textLength="197.695">accepts / refuses offers, updates status</text></g><!--link Operator to Yobbu--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk11" data-source-line="45" data-link-type="dependency"><path d="M929.75,126.247 C923.76,144.717 914.43,165.787 900.33,181.087 C867.1,217.147 818.132,242.244 776.969,258.436 C756.387,266.531 737.756,272.4 724.019,276.3 C720.584,277.275 717.456,278.127 714.679,278.859 C713.291,279.226 711.99,279.562 710.784,279.869 C710.18,280.023 709.601,280.169 709.045,280.309 C708.906,280.343 713.62,279.169 713.484,279.203" style="stroke:#444;stroke-width:1.2;" fill="none" id="Operator-to-Yobbu"/><polygon points="708.632,280.412,718.333,282.117,713.484,279.203,716.398,274.354,708.632,280.412" fill="#444" style="stroke:#444;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="930.272" y="166.369" fill="#000" font-size="10" textLength="164.272">monitors all deliveries on a map,</text><text x="917.34" y="178.01" fill="#000" font-size="10" textLength="190.137">resolves blocked cases, reads metrics</text></g><!--link Yobbu to Keycloak--><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk12" data-source-line="47" data-link-type="dependency"><path d="M693.146,335.738 C693.097,335.845 693.047,335.951 692.997,336.058 C692.597,336.91 692.176,337.751 691.735,338.58 C690.852,340.236 689.885,341.842 688.828,343.379 C686.713,346.453 684.234,349.253 681.33,351.647 C664.81,365.257 600.1,344.147 585.33,359.647 C571.85,373.807 570.472,390.909 573.142,409.309" style="stroke:#444;stroke-width:1.2;" fill="none" id="Yobbu-to-Keycloak"/><polygon points="573.86,414.257,576.526,404.776,573.142,409.309,568.609,405.925,573.86,414.257" fill="#444" style="stroke:#444;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="610.085" y="369.929" fill="#000" font-size="10" textLength="142.056">authenticates users (OIDC) ;</text><text x="586.33" y="381.57" fill="#000" font-size="10" textLength="189.565">fetches public keys to validate tokens</text></g><!--link Yobbu to Notif--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk13" data-source-line="48" data-link-type="dependency"><path d="M708.424,290.211 C709.051,290.678 709.708,291.17 710.394,291.687 C715.883,295.823 723.2,301.54 731.277,308.396 C747.432,322.107 766.63,340.372 780.33,359.647 C793.6,378.307 802.169,397.526 808.839,415.596" style="stroke:#444;stroke-width:1.2;" fill="none" id="Yobbu-to-Notif"/><polygon points="810.57,420.287,811.206,410.459,808.839,415.596,803.701,413.229,810.57,420.287" fill="#444" style="stroke:#444;stroke-width:1.2;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="825.315" y="369.929" fill="#000" font-size="10" textLength="137.1">sends push, SMS and email</text><text x="796.05" y="381.57" fill="