name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  # ── Java services ────────────────────────────────────────────────────────────
  java:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - order-svc
          - dispatch-svc
          - tracking-svc
          - payment-svc
          - notification-svc

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.10.2'

      - name: Build and test ${{ matrix.service }}
        working-directory: services
        run: gradle :${{ matrix.service }}:build --no-daemon

  # ── Frontend apps ────────────────────────────────────────────────────────────
  frontend:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - customer-app
          - courier-app
          - operator-app

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: apps/${{ matrix.app }}/package.json

      - name: Install dependencies
        working-directory: apps/${{ matrix.app }}
        run: pnpm install

      - name: Type-check
        working-directory: apps/${{ matrix.app }}
        run: pnpm exec tsc --noEmit

      - name: Build
        working-directory: apps/${{ matrix.app }}
        run: pnpm build

  # ── Docker build (smoke test) ─────────────────────────────────────────────────
  docker:
    name: Docker build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            dockerfile: services/gateway/Dockerfile
            context: services
          - service: order-svc
            dockerfile: services/order-svc/Dockerfile
            context: services
          - service: dispatch-svc
            dockerfile: services/dispatch-svc/Dockerfile
            context: services
          - service: tracking-svc
            dockerfile: services/tracking-svc/Dockerfile
            context: services
          - service: payment-svc
            dockerfile: services/payment-svc/Dockerfile
            context: services
          - service: notification-svc
            dockerfile: services/notification-svc/Dockerfile
            context: services
          - service: customer-app
            dockerfile: apps/customer-app/Dockerfile
            context: apps/customer-app
          - service: courier-app
            dockerfile: apps/courier-app/Dockerfile
            context: apps/courier-app
          - service: operator-app
            dockerfile: apps/operator-app/Dockerfile
            context: apps/operator-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.service }})
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          tags: yobbu/${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
