// Root build file — declares plugins and common repository for all subprojects.
// Each subproject applies the plugins it needs in its own build.gradle.
plugins {
    id 'org.springframework.boot' version '3.3.5' apply false
    id 'io.spring.dependency-management' version '1.1.6' apply false
    // 'java' is a core Gradle plugin — subprojects apply it directly, no root declaration needed
}

subprojects {
    repositories {
        mavenCentral()
    }
}
