spring:
  application:
    name: tracking-svc
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/yobbu?currentSchema=tracking}
    username: ${DB_USER:yobbu_tracking}
    password: ${DB_PASSWORD_TRACKING}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: tracking
  flyway:
    schemas: tracking
    default-schema: tracking
    validate-on-migrate: true

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
